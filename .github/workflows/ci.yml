name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Read-only: this workflow only lints and tests, so it never needs a writable token.
permissions:
  contents: read

# `push` and `pull_request` both fire on a PR branch — supersede the older run instead of
# paying for both.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      # Tests are hermetic: no OPENROUTER_API_KEY, no .env, no network (tests/conftest.py).
      - name: Test
        run: uv run pytest

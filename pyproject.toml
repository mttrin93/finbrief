[project]
name = "finbrief"
version = "0.0.0"
description = "FinBrief — a domain-specialised RAG assistant for equity research (Turing College Sprint 2)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Core app + LLM
    "streamlit",
    "langchain",
    "langgraph",
    "langchain-openai",
    "python-dotenv",
    # Retrieval
    "chromadb",
    "rank-bm25",
    # Data sources
    "yfinance",
    "feedparser",
    "pypdf",
    # NOTE: eval / guardrails / mcp deps intentionally deferred until the
    # grilling + spec settle which of them earn their place. See PLAN.md §2.
    "edgartools>=5.43.0",
    "langchain-chroma>=1.1.0",
    "langchain-text-splitters>=1.1.2",
    "tiktoken>=0.13.0",
    "langgraph-checkpoint-sqlite>=3.1.0",
    "guardrails-ai>=0.10.2",
    "ragas>=0.4.3",
    "langchain-community<0.4",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finbrief"]

[tool.ruff]
line-length = 96
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # import sorting
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
]

[tool.ruff.lint.per-file-ignores]
# Streamlit pages are scripts: `st.stop()` makes flow control legal mid-module.
"app/*.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

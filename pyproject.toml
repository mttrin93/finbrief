[project]
name = "finbrief"
version = "0.0.0"
description = "FinBrief — a domain-specialised RAG assistant for equity research (Turing College Sprint 2)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Core app + LLM
    "streamlit",
    "langchain",
    "langgraph",
    "langchain-openai",
    "python-dotenv",
    # Retrieval
    "chromadb",
    "rank-bm25",
    # Data sources
    "yfinance",
    "feedparser",
    "pypdf",
    # NOTE: eval / guardrails / mcp deps intentionally deferred until the
    # grilling + spec settle which of them earn their place. See PLAN.md §2.
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finbrief"]
